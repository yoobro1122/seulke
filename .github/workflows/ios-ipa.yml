# 슬케줄러 iOS: 서명 없는 .ipa 빌드
# 이 Mac(macOS 12 / Xcode 14.2)으로는 iOS 26 기기에 설치할 수 없어서,
# GitHub의 macOS 26 + Xcode 26 환경에서 빌드한 뒤 Sideloadly로 무료 Apple ID 서명·설치한다.
name: iOS IPA

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 버전
        run: xcodebuild -version

      - name: 기기용 빌드 (서명 없이)
        working-directory: ios
        run: |
          xcodebuild -project Seulkeduler.xcodeproj -scheme Seulkeduler \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build > build.log 2>&1 || { grep -E "error:" build.log | sort -u; tail -60 build.log; exit 1; }
          grep -E "warning:" build.log | sort -u | head -40 || true

      - name: .ipa 만들기
        working-directory: ios
        run: |
          APP=build/Build/Products/Release-iphoneos/Seulkeduler.app
          # Sideloadly가 App Group 권한을 읽을 수 있도록 entitlements를 넣어 임시(ad-hoc) 서명
          codesign -f -s - --entitlements SeulWidget/SeulWidget.entitlements "$APP/PlugIns/SeulWidget.appex"
          codesign -f -s - --entitlements Seulkeduler/Seulkeduler.entitlements "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Seulkeduler.ipa Payload
          ls -lh Seulkeduler.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Seulkeduler-ipa-${{ github.run_number }}
          path: ios/Seulkeduler.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log-${{ github.run_number }}
          path: ios/build.log
          retention-days: 7
